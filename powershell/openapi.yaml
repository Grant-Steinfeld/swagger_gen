openapi: 3.0.0
info:
  title: Pet Store API
  version: 1.0.0
  description: API for African Dogs, Cats, and Tropical Fish inventory with validation.
servers:
  - url: http://localhost:3000/api
paths:  :
    :
      summary:  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              ": '#/components/schemas/Pet'
            examples:
              dogExample:
                summary: Example Dog
                value:
                  type: dog
                  breed: "Africanis"
                  name: "Simba"
                  age: 3
                  description: "Friendly, loyal, and energetic."
              catExample:
                summary: Example Cat
                value:
                  type: cat
                  breed: "Abyssinian"
                  name: "Nala"
                  age: 2
                  description: "Curious, agile, and affectionate."
              fishExample:
                summary: Example Tropical Fish
                value:
                  type: fish
                  breed: "Congo Tetra"
                  name: "Bubbles"
                  age: 1
                  description: "Colorful, peaceful, and active."
      responses:
        '200':
          description: Success
        '400':
          description: Validation error
        '500':
          description: Internal server error  :
